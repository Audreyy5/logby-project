
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Logby - Quiz</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="quiz-page">

        <!-- Header -->
        <header class="quiz-header">
            <a href="index.html" class="quiz-logo" aria-label="Logby home">
                <img src="assets/logo.png" alt="Logby">
            </a>

            <p class="greeting">
                Nice to meet you, <span id="playerGreeting">Player</span>!
            </p>
        </header>

        <!-- Question -->
        <section class="quiz-content container">
            <p class="question-progress" id="questionProgress">
                Question 1 of 7
            </p>

            <h1 class="question-title" id="questionTitle">
                Oh, no! Your team just lost in a ranked match.
                How would you react?
            </h1>

            <div
                class="answer-list"
                id="answerList"
                role="group"
                aria-label="Answer choices"
            >
            </div>

            <p
                class="answer-error"
                id="answerError"
                role="status"
                aria-live="polite"
            ></p>
        </section>

        <!-- Navigation -->
        <footer class="quiz-footer">
            <button type="button" id="backButton" class="back-button">
                Back
            </button>

            <button type="button" id="nextButton" class="next-button">
                Next questions
            </button>
        </footer>

    </main>

    <script src="quiz.js"></script>
</body>
</html>
