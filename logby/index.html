
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Logby - Your Gamer Personality</title>
    <meta name="description" content="Discover what kind of gamer you are with Logby!">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="home-page">
        <section class="home-content container text-center">

            <a href="index.html" class="logo" aria-label="Logby home">
                <img
                    src="assets/logo.png"
                    alt="Logby"
                    class="logo-image"
                >
            </a>

            <h1 class="tagline">
                How was your match? Find out<br class="desktop-break">
                about what kind of gamer are you!
            </h1>

            <form id="nameForm" class="name-form" novalidate>
                <label for="playerName" class="visually-hidden">
                    Your name
                </label>

                <input
                    type="text"
                    id="playerName"
                    class="name-input"
                    placeholder="Enter your name..."
                    maxlength="30"
                    autocomplete="given-name"
                    aria-describedby="nameError"
                    required
                >

                <p id="nameError" class="error-message" role="alert"></p>

                <button type="submit" class="start-button">
                    Test it out!
                </button>
            </form>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
