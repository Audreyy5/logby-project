
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Gamer Type | Logby</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="result-page">

    <main class="container-fluid py-4 px-3 px-md-4">
        <section class="result-card" id="resultCard">
            <div class="result-logo">
                <img src="assets/logo.png" alt="Logby logo">
            </div>

            <div class="result-content">
                <div class="result-info">
                    <p class="you-are">You are</p>
                    <h1 id="resultTitle">Loading...</h1>
                    <div class="result-tags" id="resultTags"></div>
                </div>

                <div class="result-image">
                    <img id="resultImage" src="" alt="Your gamer type">
                </div>
            </div>

            <section class="result-description">
                <h2>What does it mean?</h2>
                <p id="resultDescription"></p>
            </section>

            <div class="result-actions">
                <button class="download-button" id="downloadButton">
                    Download
                </button>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="result.js"></script>
</body>
</html>
